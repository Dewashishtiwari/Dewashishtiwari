name: Generate expanded GitHub metrics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Explain missing optional token
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "METRICS_TOKEN is not configured; keeping the starter metrics panel."

      - name: Generate metrics
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          config_display: large
          base: header, activity, community, repositories, metadata
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_followup: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 60
          plugin_languages_recent_load: 500
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_repositories: yes
          plugin_repositories_featured: Dewashishtiwari/Dewashishtiwari
